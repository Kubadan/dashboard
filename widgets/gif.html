<div class="video-widget"> 
  <video
    src="mia.mp4"
    muted
    playsinline
    preload="metadata"
  ></video>
</div>

<style>
.video-widget {
  width: 100%;       /* roztáhne widget do šířky rodiče */
  overflow: hidden;
}

.video-widget video {
  width: 100%;       /* video zaplní šířku widgetu */
  height: auto;      /* zachování poměru stran */
  display: block;
}
</style>

<script>
document.querySelectorAll('.video-widget').forEach(widget => {
  const video = widget.querySelector('video');

  widget.addEventListener('mouseenter', () => {
    video.currentTime = 2;
    video.play();
  });

  widget.addEventListener('mouseleave', () => {
    video.pause();
    video.currentTime = 0;
  });
});
</script>
